<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Day Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🗓 Мой день</h1>
        
        <div class="settings">
            <label>Начало дня:</label>
            <input type="time" id="start-time" value="12:00">
        </div>

        <div class="input-area">
            <input type="text" id="task-name" placeholder="Например: Сценарий для видео">
            <input type="number" id="task-duration" placeholder="Минут (напр. 60)">
            <button id="add-task-btn">Добавить</button>
        </div>

        <div class="lists-container">
            <div class="draft-list">
                <h3>Список дел:</h3>
                <ul id="tasks-ul"></ul>
                <div class="action-buttons">
                    <button id="generate-btn">Сгенерировать расписание</button>
                    <button id="clear-btn" class="danger-btn">Очистить всё</button>
                </div>
            </div>

            <div class="final-schedule">
                <h3>Готовое расписание:</h3>
                <ul id="schedule-ul"></ul>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
